#
# Release of ship-it (docs/design/workflows.md §2 and §5), on a v* tag:
# 1. check: the same verifications as a pull request (tools/check);
# 2. release: GoReleaser builds linux/darwin/windows × amd64/arm64 archives,
#    checksums.txt and one SPDX SBOM per archive (syft), then creates a draft
#    GitHub release; cosign signs checksums.txt keylessly (bundle
#    checksums.txt.sigstore.json, a release asset) and
#    actions/attest-build-provenance signs a SLSA build provenance for every
#    file listed in checksums.txt (Sigstore, keyless);
# 3. the image ghcr.io/gregoiref/ship (linux/amd64 + linux/arm64, buildx
#    with QEMU): GoReleaser pushes it, cosign signs it (docker_signs) and
#    attest-build-provenance attaches a provenance to its index in GHCR;
# 4. nothing for Homebrew and Scoop: the tap GregoireF/homebrew-tap pulls
#    each stable release on its own and verifies its provenance; this
#    workflow holds no secret that writes there.
# The release job waits for the owner's approval in the `release` environment.
# Verify a download: docs/design/workflows.md §5 (cosign verify-blob or
# gh attestation verify).
# No cache anywhere: a release must not read a cache that a pull request
# could have written (zizmor: cache-poisoning).
name: release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

# Never cancel a release half-way; a second tag waits for the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: check
        run: go run ./tools/check -race

  release:
    name: release
    needs: check
    # Required reviewer: the owner approves every release (protection rule of
    # the environment, created by hand: docs/design/workflows.md §5).
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # OIDC token for the Sigstore signatures (cosign, attestations)
      attestations: write # store the build provenance attestations
      packages: write # push the image, its signature and attestation to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the tags and history for the changelog.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # syft for the SBOMs, at the version pinned by this action release.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # cosign for the signature of checksums.txt; the installer verifies the
      # cosign binary it downloads.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4 # pin: cosign
      # Emulation for the linux/arm64 RUN step of build/docker/Dockerfile;
      # binfmt image pinned by digest, no cache (zizmor: cache-poisoning).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0 # pin: buildx
          cache-binary: false
      # The job's own token: packages: write above, nothing stored in secrets.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The notes of the release are the version's section of CHANGELOG.md,
      # not a list of commits (a squashed release pull request is one commit).
      # It fails without a dated section: no release goes out without notes.
      - name: release notes
        env:
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: go run ./tools/releasenotes "$TAG" > "$NOTES"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0 # pin: goreleaser
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # The index digest of the image, from GoReleaser's artifact list
      # (type "Docker Image", extra.Digest; one digest for every tag).
      - name: image digest
        id: image
        run: |
          set -euo pipefail
          digest="$(jq -r '[.[] | select(.type == "Docker Image") | .extra.Digest] | unique | if length == 1 then .[0] else error("expected one image digest, got \(length)") end' dist/artifacts.json)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected image digest: $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/gregoiref/ship
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
