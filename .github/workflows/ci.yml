#
# Quality gate of every pull request (docs/design/workflows.md §1). The checks
# themselves live in tools/check, so that a laptop runs exactly the same.
#
# Each job runs on the systems the change needs (#146): `changes` sorts the
# changed files (tools/changes), and the jobs skip with `if:`. GitHub reports
# a job skipped by a condition as success, while a workflow skipped by a path
# filter leaves a required check pending, so no `paths:` here. `changes` is a
# required check itself: if it failed, the jobs that need it would be skipped,
# and a skipped job reads as a success. A push to main runs everything.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs (zizmor: excessive-permissions).
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.sort.outputs.go }}
      system: ${{ steps.sort.outputs.system }}
      extension: ${{ steps.sort.outputs.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base with the target branch must be there.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Expressions go through the environment (zizmor: template-injection).
      - name: sort the changed files
        id: sort
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: go run ./tools/changes -base "$BASE" >> "$GITHUB_OUTPUT"

  # Linux always: it is the reference, and it checks the docs and the
  # generated files as well as the code.
  check-linux:
    name: check (ubuntu-latest)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: check
        run: go run ./tools/check -fuzztime=10s -race=true

  # Windows when Go changes: paths, line endings and processes differ there.
  # The race detector needs cgo, which the Windows runner lacks.
  check-windows:
    name: check (windows-latest)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: check
        shell: bash
        run: go run ./tools/check -fuzztime=10s -race=false

  # macOS when the code that talks to the system changes: the free plan runs
  # five macOS jobs at once for the whole account, so they queue.
  check-macos:
    name: check (macos-latest)
    needs: changes
    if: needs.changes.outputs.system == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: check
        run: go run ./tools/check -fuzztime=10s -race=true

  # Performance budgets (docs/design/performance.md), on one OS: the git
  # processes per command are the same everywhere, and blocking on them never
  # flakes; time ceilings keep a wide headroom for shared runners.
  bench:
    name: bench (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: budgets
        run: go run ./tools/bench

  # Test coverage, sent to Codecov (docs/design/workflows.md §1). OIDC proves
  # the upload comes from this repository: no token to keep. A fork's pull
  # request gets no OIDC token, so only this repository's branches upload, and
  # a Codecov outage never fails the pull request.
  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.go == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for Codecov's tokenless upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # -coverpkg counts the code the end-to-end tests of cmd/ship run too.
      - name: test
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: false

  # The extension, on two systems, as two jobs rather than a matrix: a matrix
  # job skipped by its condition keeps the unexpanded name
  # "extension (${{ matrix.os }})", so the required "extension (ubuntu-latest)"
  # would never report and every pull request would wait for it.
  extension-linux:
    name: extension (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      # The binary the contract test talks to: the one of this commit.
      - name: build ship
        working-directory: .
        shell: bash
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go build -o "extensions/vscode/out/ship$EXE" ./cmd/ship
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: test
        env:
          SHIP_BIN: ${{ github.workspace }}/extensions/vscode/out/ship${{ runner.os == 'Windows' && '.exe' || '' }}
        run: npm test
  extension-windows:
    name: extension (windows-latest)
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      # The binary the contract test talks to: the one of this commit.
      - name: build ship
        working-directory: .
        shell: bash
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go build -o "extensions/vscode/out/ship$EXE" ./cmd/ship
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: test
        env:
          SHIP_BIN: ${{ github.workspace }}/extensions/vscode/out/ship${{ runner.os == 'Windows' && '.exe' || '' }}
        run: npm test
