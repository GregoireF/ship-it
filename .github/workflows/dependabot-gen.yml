#
# Generated files on Dependabot pull requests (docs/design/workflows.md §10): a
# dependency bump changes THIRD_PARTY_NOTICES.txt (and may change other
# outputs of `go run ./tools/gen`), whose staleness test would fail. This
# workflow regenerates them and commits the result to the pull request.
#
# Safe pattern, without pull_request_target (zizmor: dangerous-triggers):
# - trigger `pull_request`: for Dependabot, GitHub treats the run like a
#   fork's (read-only token, Dependabot secrets only), and "you can use the
#   permissions key in your workflow to increase the access for the token";
# - only pull requests opened by Dependabot from this repository
#   (pull_request.user.login, not github.actor: zizmor bot-conditions);
# - `generate` runs the pull request's code (the bumped dependencies are
#   compiled into tools/gen) with a read-only token and hands over the files
#   it changed;
# - `commit` can write but never checks out the pull request (CodeQL
#   actions/untrusted-checkout): it reads those files as data, refuses any
#   path outside the generated files listed below (kept in step with tools/gen
#   by its test), and creates the commit through GitHub's Git Data API (blobs,
#   tree, commit, then a fast-forward of the branch). No code of the pull
#   request runs where the write token is.
# The commit is made with an installation token of a dedicated GitHub App
# (Dependabot secrets APP_CLIENT_ID and APP_PRIVATE_KEY), so the checks run on
# it and GitHub signs it; without them it falls back to the job token, whose
# commits start no workflow run (GitHub's rule): close and reopen the pull
# request then.
name: dependabot-gen

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: dependabot-gen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: regenerate
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch's own commit, not the merge with the base.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: generate
        run: go run ./tools/gen
      # The changed files themselves, with one line per file in changed.txt:
      # "M<tab>path" (written) or "D<tab>path" (removed).
      - name: diff
        id: diff
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/generated"
          mkdir -p "$out/files"
          git add --all
          git diff --cached --name-status --no-renames > "$out/changed.txt"
          if [ ! -s "$out/changed.txt" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$out/changed.txt"
          while IFS=$'\t' read -r status path; do
            if [ "$status" != D ]; then
              mkdir -p "$out/files/$(dirname -- "$path")"
              cp -- "$path" "$out/files/$path"
            fi
          done < "$out/changed.txt"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-files
          path: ${{ runner.temp }}/generated
          retention-days: 1

  commit:
    name: commit
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # fallback commit with the job token when the App is not set up
    env:
      # Dependabot-triggered runs only read Dependabot secrets, never an
      # environment's: zizmor's secrets-outside-env (auditor) cannot apply.
      HAS_APP: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }} # zizmor: ignore[secrets-outside-env]
    steps:
      # No checkout: the files are data, read from the artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-files
          path: ${{ runner.temp }}/generated
      # A commit with an App installation token starts the checks and is
      # signed by GitHub; one with the job token starts nothing. Scoped to
      # this repository (the default without owner) and to contents: write.
      - name: app token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          permission-contents: write
      - name: commit through the API
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Every output of `go run ./tools/gen` (tools/gen's test checks it).
          ALLOWED: |
            THIRD_PARTY_NOTICES.txt
            schemas/ship.schema.json
            schemas/policy.schema.json
            schemas/user.schema.json
            docs/reference/settings.md
            docs/reference/errors.md
            extensions/vscode/src/generated/tools.ts
            build/ship-it-action/action.yml
            build/ship-it-action/README.md
            build/ship-it-action/LICENSE
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/generated"
          # Dependabot pushed again meanwhile: that run will regenerate.
          current="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha)"
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "The branch moved since $HEAD_SHA: nothing to do."
            exit 0
          fi

          entries='[]'
          while IFS=$'\t' read -r status path; do
            if ! printf '%s\n' "$ALLOWED" | grep -qxF -- "$path"; then
              echo "::error::the change touches $path, which tools/gen does not generate"
              exit 1
            fi
            if [ "$status" = D ]; then
              entries="$(jq -c --arg p "$path" '. + [{path: $p, mode: "100644", type: "blob", sha: null}]' <<<"$entries")"
              continue
            fi
            file="$dir/files/$path"
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              echo "::error::$path is missing from the generated files, or is not a regular file"
              exit 1
            fi
            blob="$(base64 -w0 -- "$file" | jq -Rs '{content: ., encoding: "base64"}' |
              gh api "repos/$REPO/git/blobs" --input - --jq .sha)"
            entries="$(jq -c --arg p "$path" --arg s "$blob" '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' <<<"$entries")"
          done < "$dir/changed.txt"

          # The sign-off names the author of the commit: the App's bot user,
          # or github-actions[bot] with the job token.
          if [ -n "$APP_SLUG" ]; then
            login="${APP_SLUG}[bot]"
            id="$(gh api "users/$(jq -rn --arg l "$login" '$l|@uri')" --jq .id)"
          else
            login="github-actions[bot]"
            id=41898282
          fi
          message="📦️ build(deps): regenerate the generated files

          Output of go run ./tools/gen after the dependency update. [dependabot skip]: Dependabot may still rebase and force-push over this commit; this workflow then runs again.

          Signed-off-by: $login <$id+$login@users.noreply.github.com>"

          base_tree="$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq .tree.sha)"
          tree="$(jq -n --arg b "$base_tree" --argjson e "$entries" '{base_tree: $b, tree: $e}' |
            gh api "repos/$REPO/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg m "$message" --arg t "$tree" --arg p "$HEAD_SHA" '{message: $m, tree: $t, parents: [$p]}' |
            gh api "repos/$REPO/git/commits" --input - --jq .sha)"
          # A fast-forward only: it fails if the branch moved since.
          jq -n --arg s "$commit" '{sha: $s, force: false}' |
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" --input - --jq .object.sha
          if [ -z "$APP_SLUG" ]; then
            echo "::notice::Committed with the job token: the checks will not run on the new commit. Close and reopen the pull request before merging, or set up the App (docs/design/workflows.md §10)."
          fi
