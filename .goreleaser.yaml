# Copyright 2026 Grégoire Favreau
#
# Release of the ship binary (docs/design/workflows.md §2 and §5), run by
# .github/workflows/release.yml on a v* tag. Validate with:
#   go run github.com/goreleaser/goreleaser/v2@v2.19.0 check # pin: goreleaser
# Reference: https://goreleaser.com/customization/
version: 2

project_name: ship-it

before:
  hooks:
    # The module cache must match go.sum before anything is built.
    - go mod verify

builds:
  - id: ship
    main: ./cmd/ship
    binary: ship
    env:
      # Static binaries: ship-it only shells out to git, it needs no libc.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible builds: no local paths, commit date instead of build date
    # (https://goreleaser.com/customization/builds/go/).
    flags:
      - -trimpath
    # cmd/ship/main.go reads main.version, main.commit and main.date.
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: ship
    ids: [ship]
    formats: [tar.gz]
    name_template: "ship_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # THIRD_PARTY_NOTICES.txt: the licences of the modules linked into the
    # binary (MIT, BSD-3-Clause), generated by go run ./tools/gen.
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.txt
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX JSON SBOM per archive, made by syft (CRA engagement E5,
# docs/design/cra-commitments.md). syft is installed by the workflow.
sboms:
  - id: archives
    artifacts: archive

# Keyless signature of checksums.txt with the GitHub OIDC identity of the
# release workflow (CRA engagement E6). The bundle (certificate + signature +
# transparency log entry) is uploaded with the release.
# https://goreleaser.com/customization/sign/sign/
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# Image for users' CI: ghcr.io/gregoiref/ship (build/docker/Dockerfile), the
# ship binary with git, so that a job can run `ship check title` and
# `ship check branch` against the repository's conventions. It releases
# nothing: ship has no release command yet. One multi-platform index built
# with docker buildx. Needs a buildx builder with QEMU (the Dockerfile has a
# RUN step) and a docker login to ghcr.io; a --snapshot run builds the
# images without pushing them.
# Reference: https://goreleaser.com/customization/dockers_v2/
dockers_v2:
  - id: ship
    ids: [ship]
    dockerfile: build/docker/Dockerfile
    # Copied by the Dockerfile to /usr/share/licenses/ship/.
    extra_files:
      - LICENSE
      - THIRD_PARTY_NOTICES.txt
    images:
      - ghcr.io/gregoiref/ship
    # A pre-release (v1.2.0-rc.1) gets its exact tag only, never "latest".
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # OCI labels (https://specs.opencontainers.org/image-spec/annotations/);
    # org.opencontainers.image.source links the GHCR package to the repository.
    labels:
      org.opencontainers.image.title: ship
      org.opencontainers.image.description: "ship and git for CI jobs: check pull request and commit titles and branch names against your conventions"
      org.opencontainers.image.url: https://github.com/GregoireF/ship-it
      org.opencontainers.image.source: https://github.com/GregoireF/ship-it
      org.opencontainers.image.documentation: https://github.com/GregoireF/ship-it#readme
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.authors: Grégoire Favreau
    # On the index too: GHCR shows the index description on the package page.
    annotations:
      org.opencontainers.image.description: "ship and git for CI jobs: check pull request and commit titles and branch names against your conventions"
      org.opencontainers.image.source: https://github.com/GregoireF/ship-it
      org.opencontainers.image.licenses: Apache-2.0
    # sbom defaults to true: buildx attaches an SPDX SBOM to each image (CRA
    # engagement E5).

# Keyless signature of the images built by dockers_v2, with the same
# OIDC identity; cosign stores it next to the image in GHCR. Verify with:
#   cosign verify ghcr.io/gregoiref/ship:<version> \
#     --certificate-identity-regexp "^https://github.com/GregoireF/ship-it/" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# https://goreleaser.com/customization/sign/docker_sign/
docker_signs:
  - cmd: cosign
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

# Homebrew: no section here. The formula Formula/ship.rb of the tap
# GregoireF/homebrew-tap (brew install gregoiref/tap/ship) is written by
# scripts/homebrew-formula.sh from dist/checksums.txt and pushed by the
# release workflow after this run, over SSH with the same deploy key.
# Not a cask: the macOS binaries are not signed nor notarized, so a cask
# would have to strip the quarantine attribute, which Homebrew maintainers
# advise against (https://github.com/orgs/Homebrew/discussions/7050), and a
# cask does not install on Linux. Not GoReleaser's formula generator either:
# `brews` is deprecated (https://goreleaser.com/deprecations/#brews) and
# makes `goreleaser check` fail.
# Scoop manifest in the same repository, under bucket/ship.json:
#   scoop bucket add gregoiref https://github.com/GregoireF/homebrew-tap
#   scoop install ship
# Scoop reads a bucket's manifests from its bucket/ folder when there is one
# (Find-BucketDirectory, and `scoop bucket list` counts that folder:
# https://github.com/ScoopInstaller/Scoop/blob/master/lib/buckets.ps1), so
# one repository serves Homebrew and Scoop. GoReleaser's warning about a
# directory concerns other folder names. It uses the Windows zip archives.
# Reference: https://goreleaser.com/customization/publish/scoop/
scoops:
  - name: ship
    directory: bucket
    homepage: https://github.com/GregoireF/ship-it
    description: "You write the code, ship handles git and GitHub"
    license: Apache-2.0
    repository:
      owner: GregoireF
      name: homebrew-tap
      branch: main
      # Pushed over SSH with a deploy key that can write to this repository
      # only (secret HOMEBREW_TAP_SSH_KEY: the key itself, not a path).
      # https://goreleaser.com/customization/publish/scoop/ (repository.git)
      git:
        url: "git@github.com:GregoireF/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
    commit_msg_template: "ship {{ .Tag }} (scoop)"
    skip_upload: auto

# Unused by release.yml, which passes the CHANGELOG.md section with
# --release-notes; kept for a local `goreleaser release --snapshot`.
changelog:
  sort: asc

release:
  # Explicit: the repository is not inferred from a git remote.
  github:
    owner: GregoireF
    name: ship-it
  # Published as soon as every artifact is attached: GitHub releases stay
  # drafts while GoReleaser uploads, then GoReleaser publishes them
  # (https://goreleaser.com/customization/publish/release/). The owner's
  # approval happens earlier, in the release environment.
  draft: false
